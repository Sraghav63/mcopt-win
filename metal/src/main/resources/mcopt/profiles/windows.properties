# Portable optimizations shared with the Mac alpha profile. Windows gains need measurement.
mcopt.chunk.saveSkip=true
mcopt.chunk.mesh=all,biome
# Kept only with >=16 GB physical RAM and >=2 GB Java heap.
mcopt.chunk.clones=4096
mcopt.chunk.clonesCleanup=true
mcopt.cpu.lists=true
mcopt.cpu.cullRecover=true
mcopt.startup.narrator=lazy
mcopt.alloc.lightMap=true
mcopt.cpu.model=true

# Native Vulkan GPU path: reuse Minecraft's Vulkan backend with mcopt optimizations.
mcopt.vulkan.pipelineCache=true
mcopt.vulkan.stateCache=true
mcopt.vulkan.mergeDraws=true
